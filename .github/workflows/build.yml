name: KINAMIXTE TECHNOLOGIE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extraire le projet KINAMIXTE
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "Aucun fichier ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          rm -rf _project
          mkdir -p _project

          unzip -q "$ZIP" -d _project

          ROOT=$(find _project -mindepth 1 -maxdepth 1 -type d -print -quit)

          if [ -z "$ROOT" ]; then
            echo "Dossier du projet Android introuvable."
            exit 1
          fi

          cp -a "$ROOT"/. .

          test -f settings.gradle
          test -f app/build.gradle

          echo "Projet Android extrait avec succès."

      - name: Construire l'APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Vérifier l'APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

          echo "APK créé et signé correctement."

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: KINAMIXTE-TECHNOLOGIE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
